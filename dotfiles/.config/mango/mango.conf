# ~/.config/mango/config.conf

# ────────────── Startup Applications ──────────────
# Replaces niri's spawn-sh-at-startup
exec-once=noctalia

# ────────────── Visuals & Window Rules ──────────────
# Ported from your layout.kdl & rules.kdl
border_radius=20
blur=1
shadows=1

# ────────────── Keybindings ──────────────
# Syntax: bind = MODIFIER, KEY, ACTION, [COMMAND]
# Note: MangoWM uses "SUPER" instead of "Mod"

# ─── Core Noctalia v5 Keybinds ───
bind=SUPER|CTRL,Return,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER|SHIFT,q,spawn_shell,noctalia msg panel-toggle sessionMenu
bind=SUPER|ALT,l,spawn_shell,noctalia msg lockScreen lock

# ─── Applications ───
bind=SUPER,Return,spawn,kitty
bind=SUPER,b,spawn,helium-browser
bind=SUPER,space,spawn,fuzzel
bind=SUPER,e,spawn,dolphin

# Toggle Night Light
bind=SUPER|SHIFT,n,spawn_shell,if pgrep -x wlsunset > /dev/null 2>&1; then pkill -x wlsunset; else wlsunset -t 4000 -T 6500 -S 00:00 -s 00:01 & fi

# ─── Media Controls (Noctalia v5 Native IPC) ───
bind=none,XF86AudioRaiseVolume,spawn_shell,noctalia msg volume-up
bind=none,XF86AudioLowerVolume,spawn_shell,noctalia msg volume-down
bind=none,XF86AudioMute,spawn_shell,noctalia msg volume-mute

# Media playback (Requires 'playerctl' installed as Mango has no built-in media daemon)
bind=none,XF86AudioNext,spawn_shell,playerctl next
bind=none,XF86AudioPrev,spawn_shell,playerctl previous
bind=none,XF86AudioPlay,spawn_shell,playerctl play-pause
bind=none,XF86AudioPause,spawn_shell,playerctl play-pause

# ─── Dual Monitor Brightness Controls ───
bind=none,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10% & ddcutil setvcp 10 + 10
bind=none,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%- & ddcutil setvcp 10 - 10

# ─── Window Management ───
# Replaces niri's close-window
bind=SUPER,q,killclient

# Focus Movement
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down

# ─── Tags / Workspaces ───
# MangoWM uses Tags (1-9) rather than Niri's scrolling workspace columns.
# View tags 1-9
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move window to tags 1-9
bind=SUPER|CTRL,1,tag,1
bind=SUPER|CTRL,2,tag,2
bind=SUPER|CTRL,3,tag,3
bind=SUPER|CTRL,4,tag,4
bind=SUPER|CTRL,5,tag,5
bind=SUPER|CTRL,6,tag,6
bind=SUPER|CTRL,7,tag,7
bind=SUPER|CTRL,8,tag,8
bind=SUPER|CTRL,9,tag,9

# ─── Modes & Layouts ───
bind=SUPER,t,togglefloating
bind=SUPER,f,fullscreen

# ─── Screenshots ───
# Niri has built-in screenshots. MangoWM requires external Wayland tools.
# You will need to run: sudo pacman -S grim slurp wl-clipboard
bind=CTRL|SHIFT,1,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=CTRL|SHIFT,2,spawn_shell,grim - | wl-copy

# ─── Exit / Power ───
bind=CTRL|ALT,Delete,quit
